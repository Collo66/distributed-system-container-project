services:
  web:
    build: .
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: contact_db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db
      - mail

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: contact_db
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  mail:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  db_data: